# Example scheduled snapshot publisher (issue #34, docs-only example).
# One machine is the single writer: this workflow publishes the store
# snapshot on a schedule. Everyone else only pulls. GITHUB_TOKEN is the
# only credential (no PAT); the snapshot ref lives in THIS private store
# repo, never in a zmem sync repo (credential separation, README).
name: snapshot-publish
on:
  schedule:
    - cron: "0 3 * * *" # daily 03:00 UTC
  workflow_dispatch:
permissions:
  contents: write
jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Publish the store snapshot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          pip install git+https://github.com/ZaxbyHub/zaxbygraph.git
          zaxbygraph sync --repo OWNER/REPO
          zaxbygraph snapshot publish "$GITHUB_SERVER_URL/$GITHUB_REPOSITORY" \
            --repo OWNER/REPO --publisher scheduled-action
