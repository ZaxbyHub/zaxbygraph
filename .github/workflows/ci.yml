name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is the primary target platform, so it is a first-class leg
        # here: path handling, SQLite/WAL file locking and subprocess argv
        # quoting all differ from Linux.
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e . pytest
      - name: Help
        run: zaxbygraph --help
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Documented pytest form
        run: python -m pytest tests/test_store.py -q
      # unittest discovery never executes module-level pytest functions, so the
      # function-style regression checks below would otherwise not run in CI at
      # all (and the Windows-gated device fix would never be exercised on the
      # ubuntu legs). Only module-level pins are listed here; class-based check
      # modules (e.g. tests/test_feedback_round_bounds.py) are NOT listed
      # because the unittest step above already runs every test in them.
      - name: Seam regression checks (pytest form)
        run: >-
          python -m pytest
          tests/test_seam_honesty.py
          tests/test_seams_extended.py
          tests/test_mcp_server.py
          tests/test_cursor_grammar.py
          tests/test_triage_bounds.py
          tests/test_hint_fallback.py
          tests/test_token_canonicalization.py
          tests/test_device_names_extended.py
          tests/test_db_uri_open.py::test_authorizer_denies_fts3_tokenizer
          tests/test_export_alias_guard.py::test_dos_device_names_refused
          -q

