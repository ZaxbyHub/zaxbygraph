name: ci

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        # Windows is the primary target platform, so it is a first-class leg
        # here: path handling, SQLite/WAL file locking and subprocess argv
        # quoting all differ from Linux.
        os: [windows-latest, ubuntu-latest]
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Install
        run: pip install -e . pytest
      - name: Help
        run: zaxbygraph --help
      - name: Tests
        run: python -m unittest discover -s tests -v
      - name: Documented pytest form
        run: python -m pytest tests/test_store.py -q
